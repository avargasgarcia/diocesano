<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compuertas Lógicas Básicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2efe3; --surface:#fffdf8; --surface-2:#e8e1cd;
    --grid-dot: rgba(31,42,38,0.14);
    --ink:#1f2a26; --ink-soft:#5b6b64; --ink-faint:#8a978f;
    --accent:#a84e1c; --accent-ink:#fffaf3;
    --accent-2:#2f6f5e; --accent-2-ink:#f2fbf7;
    --rail-pos:#a63a2c; --rail-neg:#2a5c8f;
    --line: rgba(31,42,38,0.16);
    --shadow: 0 1px 0 rgba(31,42,38,0.05), 0 12px 28px -18px rgba(31,42,38,0.35);
    --radius: 14px; --danger:#a63a2c;
    --led:#c0392b; --ledg:#2f8f4e;
    --n-p:#c0392b; --n-a:#d17a0f; --n-b:#7a4fb5; --n-c:#16857f; --n-d:#b0368a; --n-g:#2a5c8f;
    --board:#ece6d4; --board-hole:#b9b19a; --board-hl:rgba(47,111,94,0.18);
    --res-body:#d8c39a; --cap:#2a5c8f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#141f1b; --surface:#1a2723; --surface-2:#20322b;
      --grid-dot: rgba(238,242,238,0.10);
      --ink:#edf2ee; --ink-soft:#a7b6ae; --ink-faint:#748179;
      --accent:#e3a066; --accent-ink:#20140a;
      --accent-2:#6fcaa6; --accent-2-ink:#0a1f17;
      --rail-pos:#e2776a; --rail-neg:#7cb0e8;
      --line: rgba(238,242,238,0.14);
      --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 12px 28px -18px rgba(0,0,0,0.6);
      --danger:#e2776a;
      --led:#ff6b5b; --ledg:#5fd08a;
      --n-p:#ff7a6b; --n-a:#f0a54a; --n-b:#b594e8; --n-c:#4fc9c0; --n-d:#e77cc3; --n-g:#7cb0e8;
      --board:#2a3a34; --board-hole:#56685f; --board-hl:rgba(111,202,166,0.2);
      --res-body:#b9a47c; --cap:#7cb0e8;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#141f1b; --surface:#1a2723; --surface-2:#20322b;
    --grid-dot: rgba(238,242,238,0.10);
    --ink:#edf2ee; --ink-soft:#a7b6ae; --ink-faint:#748179;
    --accent:#e3a066; --accent-ink:#20140a;
    --accent-2:#6fcaa6; --accent-2-ink:#0a1f17;
    --rail-pos:#e2776a; --rail-neg:#7cb0e8;
    --line: rgba(238,242,238,0.14);
    --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 12px 28px -18px rgba(0,0,0,0.6);
    --danger:#e2776a;
    --led:#ff6b5b; --ledg:#5fd08a;
    --n-p:#ff7a6b; --n-a:#f0a54a; --n-b:#b594e8; --n-c:#4fc9c0; --n-d:#e77cc3; --n-g:#7cb0e8;
    --board:#2a3a34; --board-hole:#56685f; --board-hl:rgba(111,202,166,0.2);
    --res-body:#b9a47c; --cap:#7cb0e8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(var(--grid-dot) 1.3px, transparent 1.3px) 0 0/22px 22px, var(--bg);
    color:var(--ink); font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex; flex-direction:column; min-height:100%;
  }
  h1,h2,h3,.mono{ font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; }
  h2{ text-wrap:balance; }
  a{ color:var(--accent); }

  .topbar{ display:flex; align-items:center; gap:14px; padding:14px 20px; border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(6px); position:sticky; top:env(safe-area-inset-top,0px); z-index:20; flex-wrap:wrap; }
  .brand{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .brand .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); }
  .brand .title{ font-weight:700; font-size:14px; }
  .topbar .spacer{ flex:1; }
  .progress-wrap{ display:flex; align-items:center; gap:10px; }
  .progress-track{ width:min(34vw,220px); height:6px; border-radius:6px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line); }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); width:5%; transition:width .25s ease; }
  .progress-label{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); white-space:nowrap; }

  .stage{ flex:1; display:flex; align-items:flex-start; justify-content:center; padding:28px 16px 12px; }
  .slide{ width:100%; max-width:820px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:34px clamp(18px,4vw,46px) 30px; animation: rise .32s ease; }
  @keyframes rise{ from{ opacity:.4; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .slide{animation:none;} .spin, .flow{animation:none!important;} }

  .kicker{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .tag{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    padding:4px 9px; border-radius:20px; border:1px solid var(--line); color:var(--ink-soft); }
  .tag.time{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .tag.key{ color:var(--accent-2-ink); background:var(--accent-2); border-color:var(--accent-2); }
  .slide h2{ font-size:clamp(21px,3.2vw,27px); margin:0 0 6px; }
  .slide .sub{ color:var(--ink-soft); font-size:15px; margin:0 0 20px; max-width:62ch; }
  .body-text{ font-size:15.5px; line-height:1.65; max-width:68ch; }
  .body-text p{ margin:0 0 12px; }

  ol.steps, ul.list{ margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:10px;}
  ol.steps li{ display:flex; gap:12px; align-items:flex-start; font-size:15px; line-height:1.55; }
  ol.steps li .num{ flex:none; width:26px; height:26px; border-radius:7px; background:var(--surface-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--accent); font-weight:700; }
  ul.list li{ display:flex; gap:10px; align-items:flex-start; font-size:15px; line-height:1.55; }
  ul.list li::before{ content:"▸"; color:var(--accent); flex:none; }

  .callout{ border:1px solid var(--line); border-left:3px solid var(--accent); background:var(--surface-2);
    border-radius:10px; padding:13px 15px; font-size:14.5px; line-height:1.55; margin-top:16px; }
  .callout.warn{ border-left-color: var(--danger); }
  .callout.ok{ border-left-color: var(--accent-2); }
  .callout .callout-label{ font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); display:block; margin-bottom:4px; }
  .callout.warn .callout-label{ color:var(--danger); }
  .callout.ok .callout-label{ color:var(--accent-2); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .grid2{ grid-template-columns:1fr; } }

  .tbl-wrap{ overflow-x:auto; }
  table.formula{ width:100%; border-collapse:collapse; font-size:14.5px; margin-top:10px; }
  table.formula th, table.formula td{ border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  table.formula th{ background:var(--surface-2); font-family:'JetBrains Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  table.formula td.f{ font-family:'JetBrains Mono',monospace; color:var(--accent); font-weight:600; }

  .btn{ font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; letter-spacing:.02em;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    padding:10px 16px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.sel{ background:var(--accent-2); color:var(--accent-2-ink); border-color:var(--accent-2); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btnrow{ display:flex; gap:8px; flex-wrap:wrap; }

  .navbar{ display:flex; align-items:center; justify-content:center; gap:16px; padding:16px 16px 22px; flex-wrap:wrap; }
  .dots{ display:flex; gap:6px; flex-wrap:wrap; max-width:520px; justify-content:center; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line); cursor:pointer; padding:0; }
  .dot.active{ background:var(--accent); border-color:var(--accent); width:20px; border-radius:5px; }
  .dot.done{ background:var(--accent-2); border-color:var(--accent-2); }
  footer.hint{ text-align:center; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); padding:0 16px 16px; }
  code{ font-family:'JetBrains Mono',monospace; background:var(--surface-2); border:1px solid var(--line); padding:1px 6px; border-radius:5px; font-size:.92em; }

  /* ---- esquemáticos ---- */
  .sch-wrap{ border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:8px; overflow-x:auto; }
  .sch-wrap svg{ display:block; width:100%; min-width:320px; height:auto; }
  .sch .c, .sch .w{ transition: opacity .2s ease, stroke .2s ease; }
  .sch-wrap.focus .c{ opacity:.28; }
  .sch-wrap.focus .c.hl{ opacity:1; }
  .sch-wrap.nodes .w.n-p{ stroke:var(--n-p); stroke-width:4; } .sch-wrap.nodes .j.n-p{ fill:var(--n-p); }
  .sch-wrap.nodes .w.n-a{ stroke:var(--n-a); stroke-width:4; } .sch-wrap.nodes .j.n-a{ fill:var(--n-a); }
  .sch-wrap.nodes .w.n-b{ stroke:var(--n-b); stroke-width:4; } .sch-wrap.nodes .j.n-b{ fill:var(--n-b); }
  .sch-wrap.nodes .w.n-c{ stroke:var(--n-c); stroke-width:4; } .sch-wrap.nodes .j.n-c{ fill:var(--n-c); }
  .sch-wrap.nodes .w.n-d{ stroke:var(--n-d); stroke-width:4; } .sch-wrap.nodes .j.n-d{ fill:var(--n-d); }
  .sch-wrap.nodes .w.n-g{ stroke:var(--n-g); stroke-width:4; } .sch-wrap.nodes .j.n-g{ fill:var(--n-g); }
  .sch-wrap.on .c-LED1 polygon:first-of-type{ fill-opacity:1; filter:drop-shadow(0 0 6px var(--led)); }
  .legend{ display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:10px; font-size:13px; font-family:'JetBrains Mono',monospace; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:18px; height:5px; border-radius:3px; display:inline-block; }

  /* ---- protoboard ---- */
  .board-wrap{ border:1px solid var(--line); border-radius:12px; background:var(--surface-2); padding:8px; overflow-x:auto; }
  .board-wrap svg{ display:block; width:100%; min-width:360px; height:auto; }
  .walk{ display:grid; grid-template-columns: 1fr; gap:14px; }
  .walk-step{ display:flex; align-items:flex-start; gap:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .walk-step .n{ flex:none; font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--accent-2-ink); background:var(--accent-2); border-radius:7px; min-width:30px; height:26px; display:flex; align-items:center; justify-content:center; font-size:12.5px; padding:0 6px; }
  .walk-step .t{ font-size:14.5px; line-height:1.55; }
  .walk-step .t b{ display:block; margin-bottom:2px; }
  .walk-nav{ display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .pip{ display:flex; gap:4px; }
  .pip i{ width:18px; height:5px; border-radius:3px; background:var(--line); }
  .pip i.on{ background:var(--accent-2); }

  /* ---- quiz ---- */
  .q-card{ border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--surface); display:flex; flex-direction:column; gap:10px; }
  .q-card .sch-wrap{ border:none; padding:0; }
  .q-card .sch-wrap svg{ min-width:260px; }
  .fb{ font-size:14px; line-height:1.5; min-height:1.5em; }
  .fb.good{ color:var(--accent-2); } .fb.bad{ color:var(--danger); }
  .sym-q{ display:grid; grid-template-columns: minmax(0,200px) 1fr; gap:16px; align-items:center; }
  @media (max-width:560px){ .sym-q{ grid-template-columns:1fr; } }
  .sym-box{ border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:6px; }
  .sym-box svg{ display:block; width:100%; height:auto; }
  .class-row{ display:grid; grid-template-columns: 1fr 190px 26px; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .class-row:last-child{ border-bottom:none; }
  .class-row select{ font:inherit; font-size:14px; padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); width:100%; }
  .class-row .mark{ font-weight:700; text-align:center; }
  @media (max-width:480px){ .class-row{ grid-template-columns: 1fr 26px; } .class-row select{ grid-column:1 / 2; } }
  .num-in{ width:90px; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:15px; text-align:center; }

  /* ---- interactivos de interruptores ---- */
  .demo{ border:1px solid var(--line); border-radius:12px; background:var(--surface-2); padding:14px; display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; }
  .bulb{ width:46px; height:46px; border-radius:50%; background:color-mix(in srgb, var(--led) 18%, var(--surface)); border:2px solid var(--led); transition: all .15s ease; }
  .bulb.on{ background:var(--led); box-shadow:0 0 22px 4px color-mix(in srgb, var(--led) 60%, transparent); }
  .slider{ width:84px; height:34px; border-radius:18px; background:var(--surface); border:1px solid var(--line); position:relative; cursor:pointer; padding:0; }
  .slider::after{ content:""; position:absolute; top:4px; left:4px; width:40px; height:24px; border-radius:13px; background:var(--ink-faint); transition:left .15s ease, background .15s ease; }
  .slider.on::after{ left:38px; background:var(--accent-2); }
  .pushbtn{ width:64px; height:64px; border-radius:12px; background:var(--surface); border:1px solid var(--line); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; touch-action:none; }
  .pushbtn span{ width:34px; height:34px; border-radius:50%; background:var(--accent); box-shadow:0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); transition: transform .06s ease, box-shadow .06s ease; }
  .pushbtn.down span{ transform:translateY(3px); box-shadow:0 1px 0 color-mix(in srgb, var(--accent) 60%, #000); }
  .spin{ animation: spin 1s linear infinite; transform-origin: 50% 50%; transform-box: fill-box; }
  .spin.rev{ animation-direction: reverse; }
  @keyframes spin{ to{ transform: rotate(360deg);} }
  .legpick circle.leg{ cursor:pointer; }
  .check-item{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); }
  .check-item:last-child{ border-bottom:none; }
  .check-item input{ margin-top:3px; width:16px; height:16px; accent-color:var(--accent-2); flex:none; }
  .check-item label{ font-size:14.5px; line-height:1.5; }
  .parts{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:6px; }
  @media (max-width:640px){ .parts{ grid-template-columns:repeat(2,1fr); } }
  .part{ border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--surface-2); }
  .part b{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--accent); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.05em; }
  .part p{ margin:0; font-size:13.5px; line-height:1.45; }
  .part small{ display:block; margin-top:6px; color:var(--ink-soft); font-size:12.5px; }

  .sch-wrap.on .led polygon{ fill:var(--led); filter:drop-shadow(0 0 7px var(--led)); }
  .bar{ display:inline-block; height:10px; width:0; border-radius:5px; background:var(--accent); vertical-align:middle; transition:width .2s ease; }
  .bar.on{ width:18px; } .bar.big.on{ width:120px; background:var(--accent-2); }
  .grid2 > .sym-box svg{ max-width:360px; margin:0 auto; }

  /* ---- semana 5: capacitor ---- */
  .tank{ width:46px; height:70px; border:2px solid var(--cap); border-radius:6px 6px 8px 8px; background:var(--surface); position:relative; overflow:hidden; flex:none; }
  .tank.sm{ width:38px; height:54px; margin:6px 0; }
  .tank-fill{ position:absolute; left:0; right:0; bottom:0; background:color-mix(in srgb, var(--cap) 70%, transparent); }
  .hint-small{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-faint); margin:10px 0 0; }
  .slider:disabled{ opacity:.35; cursor:not-allowed; }

  /* ---- semana 6: fotorresistencia y zumbador ---- */
  input.light{ flex:1; min-width:140px; accent-color:var(--n-a); height:28px; }
  .bz .waves{ opacity:0; transition:opacity .15s ease; }
  .bz .waves.ring path{ animation: ring .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
  .bz .waves.ring path:nth-child(2){ animation-delay:.25s; }
  @keyframes ring{ from{ transform:scaleX(.8);} to{ transform:scaleX(1.15);} }
  @media (prefers-reduced-motion: reduce){ .bz .waves.ring path{ animation:none; } }
  .d2{ transition:opacity .2s ease; }
  .grid-gate{ display:grid; grid-template-columns:1.6fr 1fr; gap:16px; align-items:start; }
  @media (max-width:640px){ .grid-gate{ grid-template-columns:1fr; } }
</style>

<style>
  .vid{ display:flex; gap:14px; align-items:center; margin-top:16px; padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--surface-2); text-decoration:none; color:var(--ink); }
  .vid:hover{ border-color:var(--accent); }
  .vid img{ width:168px; aspect-ratio:16/9; object-fit:cover; border-radius:8px; flex:none; background:var(--line); }
  .vid-t{ display:flex; flex-direction:column; gap:3px; font-size:14px; line-height:1.4; min-width:0; }
  .vid-k{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }
  .vid-c{ color:var(--ink-soft); font-size:13px; }
  .vid-n{ color:var(--ink-soft); font-size:12.5px; font-style:italic; }
  @media (max-width:520px){ .vid{ flex-direction:column; align-items:stretch; } .vid img{ width:100%; } }
</style>

<body>

<div class="topbar">
  <div class="brand">
    <span class="eyebrow">Electrónica · Grado octavo</span>
    <span class="title">Semana 8 — Compuertas lógicas básicas</span>
  </div>
  <div class="spacer"></div>
  <div class="progress-wrap">
    <span class="progress-label mono" id="slideCounter">1 / 1</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<div class="stage"><div class="slide" id="slideHost"></div></div>

<div class="navbar">
  <button class="btn" id="prevBtn" aria-label="Diapositiva anterior">← Anterior</button>
  <div class="dots" id="dots"></div>
  <button class="btn primary" id="nextBtn" aria-label="Siguiente diapositiva">Siguiente →</button>
</div>

function kicker(tagText, key){
  return `<div class="kicker"><span class="tag${key?' key':''}">${tagText}</span></div>`;
}
function sch(key, extraClass, id){
  return `<div class="sch-wrap ${extraClass||''}" ${id?`id="${id}"`:''}>${SVG[key]}</div>`;
}
let slideDefs = [];
const after = {};
let anim = null;
function stopAnim(){ if(anim){ cancelAnimationFrame(anim); anim=null; } }

/* Brillo de un LED del esquemático: b entre 0 y 1 */
function setLed(svgHost, idx, b){
  const g = svgHost.querySelectorAll('.led')[idx]; if(!g) return;
  const poly = g.querySelector('polygon');
  poly.style.fillOpacity = (0.22 + 0.78*b).toFixed(3);
  g.style.filter = b>0.03 ? `drop-shadow(0 0 ${(2+8*b).toFixed(1)}px var(--led))` : 'none';
}
/* Palanca de un interruptor del esquemático */
function setSw(svgHost, idx, on){
  const g = svgHost.querySelectorAll('.sw')[idx]; if(!g) return;
  g.querySelector('.lev-o').style.display = on ? 'none' : '';
  g.querySelector('.lev-c').style.display = on ? '' : 'none';
}
const fmtV = v => v.toLocaleString('es-CO',{minimumFractionDigits:1, maximumFractionDigits:1})+' V';

/* Tarjeta de video de YouTube (abre en una pestaña nueva) */
function video(id, title, channel, dur, note){
  return `<a class="vid" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">
    <img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <span class="vid-t"><span class="vid-k">▶ Video · ${dur}</span><strong>${title}</strong><span class="vid-c">${channel}</span>${note?`<span class="vid-n">${note}</span>`:''}</span>
  </a>`;
}


/* Reglas de las compuertas */
const GATE = { and:(a,b)=>a&&b?1:0, or:(a,b)=>a||b?1:0, not:(a)=>a?0:1 };

/* Mini tabla de verdad con la fila actual resaltada */
function ttable(kind, a, b){
  const rows = kind==='not' ? [[0],[1]] : [[0,0],[0,1],[1,0],[1,1]];
  const head = kind==='not' ? '<tr><th>A</th><th>Salida</th></tr>' : '<tr><th>A</th><th>B</th><th>Salida</th></tr>';
  return `<div class="tbl-wrap"><table class="formula" style="text-align:center">${head}${rows.map(r=>{
    const cur = kind==='not' ? r[0]===a : (r[0]===a && r[1]===b);
    const out = kind==='not' ? GATE.not(r[0]) : GATE[kind](r[0],r[1]);
    return `<tr style="${cur?'background:var(--board-hl);font-weight:700':''}">${r.map(v=>`<td>${v}</td>`).join('')}<td class="f">${out}</td></tr>`;
  }).join('')}</table></div>`;
}

/* Slide interactiva de un circuito de compuerta */
function gateSlide(n, kind, title, chip, outPin){
  const two = kind!=='not';
  slideDefs.push({render:()=>`
    ${kicker(`Interactivo · Circuito ${n}`)}
    <h2>${title}</h2>
    <p class="sub">Mueve ${two?'SA y SB':'SA'}: cerrado = <strong>1</strong>, abierto = <strong>0</strong>. Observa LED1 y la fila de la tabla de verdad.</p>
    <div class="grid-gate">
      ${sch('circuito'+n,'','g'+n+'Sch')}
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><button class="slider" id="g${n}A" aria-label="Interruptor SA"></button><span class="mono" style="font-size:12px">SA → A</span></div>
          ${two?`<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><button class="slider" id="g${n}B" aria-label="Interruptor SB"></button><span class="mono" style="font-size:12px">SB → B</span></div>`:''}
        </div>
        <div id="g${n}T"></div>
      </div>
    </div>
    <div class="callout" id="g${n}Txt"></div>
    <p class="hint-small">Voltajes aproximados: la salida en 1 queda un poco por debajo de 5 V al encender el LED.</p>
  `});
  after[slideDefs.length-1] = ()=>{
    const host=document.getElementById('g'+n+'Sch'); let a=0,b=0;
    const upd=()=>{
      const out = two ? GATE[kind](a,b) : GATE.not(a);
      document.getElementById('g'+n+'A').classList.toggle('on',!!a); setSw(host,0,!!a);
      if(two){ document.getElementById('g'+n+'B').classList.toggle('on',!!b); setSw(host,1,!!b); }
      setLed(host,0,out);
      document.getElementById('g'+n+'T').innerHTML = ttable(kind,a,b);
      const ent = two ? `A = <strong>${a}</strong> (pata 1: ${a?'5 V':'0 V'}), B = <strong>${b}</strong> (pata 2: ${b?'5 V':'0 V'})` : `A = <strong>${a}</strong> (pata 1: ${a?'5 V':'0 V'})`;
      document.getElementById('g'+n+'Txt').innerHTML = `<span class="callout-label">${chip}</span>${ent} → salida (pata ${outPin}) = <strong>${out}</strong>: LED1 <strong>${out?'encendido':'apagado'}</strong>.`;
    };
    document.getElementById('g'+n+'A').onclick=()=>{ a=a?0:1; upd(); };
    if(two) document.getElementById('g'+n+'B').onclick=()=>{ b=b?0:1; upd(); };
    upd();
  };
}

  ["NOT con A = 0", 1, "La NOT entrega lo contrario: entra 0, sale 1."],

function pracCheck(i,v){
  const [, ok, why] = PRAC[i]; const fb=document.getElementById('prFb'+i); const good = v===ok;

}

/* ====================== MOTOR DE DIAPOSITIVAS ====================== */
let current = 0;
const host = document.getElementById('slideHost');
const dotsEl = document.getElementById('dots');
function buildDots(){
  dotsEl.innerHTML = slideDefs.map((_,i)=>`<button class="dot" aria-label="Ir a diapositiva ${i+1}" onclick="goTo(${i})"></button>`).join('');
}
function renderSlide(){
  stopAnim();
  host.innerHTML = slideDefs[current].render();
  document.getElementById('slideCounter').textContent = `${current+1} / ${slideDefs.length}`;
  document.getElementById('progressFill').style.width = `${((current+1)/slideDefs.length)*100}%`;
  [...dotsEl.children].forEach((d,i)=>{ d.classList.toggle('active', i===current); d.classList.toggle('done', i<current); });
  document.getElementById('prevBtn').disabled = current===0;
  const nb = document.getElementById('nextBtn');
  nb.textContent = current===slideDefs.length-1 ? 'Fin ✓' : 'Siguiente →';
  nb.disabled = current===slideDefs.length-1;
  if(after[current]) after[current]();
}
function goTo(i){ const n = Math.max(0, Math.min(slideDefs.length-1, i)); if(n!==current){ current=n; renderSlide(); window.scrollTo({top:0}); } }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', e=>{
  const tg = e.target.tagName;
  if(tg==='INPUT' || tg==='SELECT' || tg==='TEXTAREA' || tg==='BUTTON' && (e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
try{ const h = location.hash.replace('#s',''); if(/^\d+$/.test(h)) current = Math.min(slideDefs.length-1, Math.max(0, parseInt(h)-1)); }catch(e){}
buildDots();
renderSlide();

</script>
