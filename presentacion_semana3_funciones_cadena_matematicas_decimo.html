<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funciones SQL — Semana 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#eceef3;
  --ink:#1a2130; --ink-soft:#525b6b; --line:#d7dbe4;
  --accent:#0e7c86; --accent-ink:#ffffff;
  --amber:#b86e12; --amber-soft:#fbeedd;
  --good:#1f7a4d; --bad:#b5342d;
  --code-bg:#0f1720; --code-fg:#e6edf3; --code-key:#f2b846; --code-str:#7fd0c9; --code-com:#7c8899; --code-num:#c9a6ff;
  --f-comp:#2f6fb5; --f-arit:#7a4fb0; --f-logi:#b86e12; --f-espe:#b0407a; --f-conj:#0e7c86;
  --shadow:0 1px 2px rgba(20,25,40,.04), 0 8px 24px rgba(20,25,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1319; --surface:#161f28; --surface-2:#1d2733;
    --ink:#e7ecf2; --ink-soft:#9aa7b6; --line:#2b3745;
    --accent:#43c2c7; --accent-ink:#08181a;
    --amber:#e7a94a; --amber-soft:#2a2013;
    --good:#4fbd85; --bad:#e2695f;
    --code-bg:#080d12; --code-com:#6b7684;
    --f-comp:#6aa6e8; --f-arit:#b28be6; --f-logi:#e7a94a; --f-espe:#e07bb0; --f-conj:#43c2c7;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1319; --surface:#161f28; --surface-2:#1d2733;
  --ink:#e7ecf2; --ink-soft:#9aa7b6; --line:#2b3745;
  --accent:#43c2c7; --accent-ink:#08181a;
  --amber:#e7a94a; --amber-soft:#2a2013;
  --good:#4fbd85; --bad:#e2695f;
  --code-bg:#080d12; --code-com:#6b7684;
  --f-comp:#6aa6e8; --f-arit:#b28be6; --f-logi:#e7a94a; --f-espe:#e07bb0; --f-conj:#43c2c7;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; overscroll-behavior:none;}
h1,h2,h3{font-family:"IBM Plex Serif", Georgia, serif; text-wrap:balance; margin:0;}
h3{font-size:19px; font-weight:600;}
code,.mono{font-family:"IBM Plex Mono", ui-monospace, Consolas, monospace;}
p code, li code, td code, .callout code{background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:0 5px; font-size:.92em;}

/* ---------- shell ---------- */
#deck{position:relative; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;}
#topbar{display:flex; align-items:center; gap:14px; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--surface); flex:0 0 auto;}
#topbar .brand{font-family:"IBM Plex Mono"; font-size:12.5px; letter-spacing:.04em; color:var(--ink-soft); white-space:nowrap;}
#progress-track{flex:1 1 auto; height:5px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
#progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--amber)); transition:width .35s ease;}
#counter{font-family:"IBM Plex Mono"; font-size:12.5px; color:var(--ink-soft); white-space:nowrap; min-width:52px; text-align:right; font-variant-numeric:tabular-nums;}
#theme-btn{font-family:"IBM Plex Mono"; font-size:12px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft); border-radius:8px; padding:5px 9px; cursor:pointer;}
@media (max-width:560px){ #topbar .brand{display:none;} }
#viewport{flex:1 1 auto; position:relative; overflow:hidden;}
.slide{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding:clamp(20px,4vw,48px) clamp(16px,5vw,80px); opacity:0; transform:translateX(24px); pointer-events:none; transition:opacity .35s ease, transform .35s ease; overflow-y:auto; visibility:hidden;}
.slide.active{opacity:1; transform:none; pointer-events:auto; visibility:visible;}
@media (prefers-reduced-motion: reduce){ .slide{transition:none; transform:none;} }
.slide-inner{width:100%; max-width:960px; margin:auto; display:flex; flex-direction:column; gap:18px;}
.eyebrow{font-family:"IBM Plex Mono"; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:600;}
.slide h2{font-size:clamp(26px,4vw,40px); font-weight:600; line-height:1.15;}
.slide.cover h2{font-size:clamp(34px,6vw,58px);}
.lede{font-size:17px; line-height:1.6; color:var(--ink-soft); max-width:72ch; margin:0;}
.slide p{font-size:16px; line-height:1.65; max-width:72ch; margin:0;}
.slide ul{margin:0; padding-left:20px; line-height:1.7; font-size:16px;}
.slide.section-slide .slide-inner{border-left:4px solid var(--amber); padding-left:22px;}

#navbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 18px; border-top:1px solid var(--line); background:var(--surface);}
.navbtn{font-family:"IBM Plex Sans"; font-weight:600; font-size:14px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:10px; padding:9px 16px; cursor:pointer;}
.navbtn:hover{border-color:var(--accent);}
.navbtn:disabled{opacity:.35; cursor:default;}
.navbtn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
#dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; max-width:56vw;}
.dot{width:7px; height:7px; border-radius:99px; background:var(--line); border:none; padding:0; cursor:pointer;}
.dot.section{background:var(--amber);}
.dot.active{background:var(--accent); width:18px;}

/* ---------- components ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:clamp(14px,2.2vw,24px);}
.card h3{margin-bottom:8px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:760px){ .grid2,.grid3{grid-template-columns:1fr;} }
.grid2>*,.grid3>*,.venn-wrap>*,.tabpanel>*,.steppanel>*,.ex{min-width:0;}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:"IBM Plex Mono"; font-size:12px; font-weight:600; padding:3px 10px; border-radius:99px; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); white-space:nowrap;}

pre.code{background:var(--code-bg); color:var(--code-fg); border-radius:12px; padding:14px 18px; overflow-x:auto; font-size:14.5px; line-height:1.6; margin:0; font-family:"IBM Plex Mono", ui-monospace, monospace;}
.code .k{color:var(--code-key); font-weight:600;}
.code .s{color:var(--code-str);}
.code .c{color:var(--code-com); font-style:italic;}
.code .n{color:var(--code-num);}

.ex{display:flex; flex-direction:column; gap:8px;}
.ex-head .pill{white-space:normal;}
.ex-head{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.ex-actions{display:flex; gap:8px;}
.mini{font-family:"IBM Plex Mono"; font-size:12.5px; font-weight:600; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:8px; padding:6px 11px; cursor:pointer;}
.mini:hover{border-color:var(--accent);}
.reveal-btn{font-family:"IBM Plex Mono"; font-size:12.5px; font-weight:600; background:var(--amber-soft); color:var(--amber); border:1px solid var(--amber); border-radius:8px; padding:6px 11px; cursor:pointer;}
.reveal-box{display:none; border-left:3px solid var(--amber); background:var(--surface); border-radius:0 10px 10px 0; padding:10px 14px;}
.reveal-box.show{display:block;}
.err{font-family:"IBM Plex Mono"; font-size:13.5px; color:var(--bad); border:1px solid var(--bad); border-radius:8px; padding:8px 12px; background:color-mix(in srgb,var(--bad) 8%,var(--surface));}

.table-wrap{overflow-x:auto;}
table.data{border-collapse:collapse; width:100%; font-size:14px;}
table.data caption{caption-side:top; text-align:left; font-family:"IBM Plex Mono"; font-size:12px; color:var(--ink-soft); padding-bottom:6px;}
table.data th, table.data td{border:1px solid var(--line); padding:6px 10px; text-align:left; font-variant-numeric:tabular-nums; white-space:nowrap;}
table.data th{background:var(--surface-2); font-family:"IBM Plex Mono"; font-weight:600; font-size:12.5px;}
table.data td.null{color:var(--ink-soft); font-style:italic;}
table.ops td:first-child{font-family:"IBM Plex Mono"; font-weight:600;}

.tabs{display:flex; gap:6px; flex-wrap:wrap;}
.tab{font-family:"IBM Plex Sans"; font-weight:600; font-size:14px; padding:8px 13px; border-radius:9px 9px 0 0; cursor:pointer; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); border-bottom:none;}
.tab.active{background:var(--surface); color:var(--accent); border-color:var(--accent);}
.tabpanel{display:none; border:1px solid var(--line); border-radius:0 10px 10px 10px; padding:16px; background:var(--surface); flex-direction:column; gap:12px;}
.tabpanel.active{display:flex;}
.tabset{display:flex; flex-direction:column;}

.callout{border-radius:10px; padding:12px 16px; font-size:15px; line-height:1.6; border:1px solid var(--line); background:var(--surface);}
.callout.warn{border-left:4px solid var(--bad);}
.callout.tip{border-left:4px solid var(--accent);}
.callout.note{border-left:4px solid var(--amber);}
.callout strong{font-weight:600;}

/* familias de operadores */
.fam{--c:var(--accent);}
.fam.comp{--c:var(--f-comp);} .fam.arit{--c:var(--f-arit);} .fam.logi{--c:var(--f-logi);} .fam.espe{--c:var(--f-espe);} .fam.conj{--c:var(--f-conj);}
.famcard{border:1px solid var(--line); border-top:4px solid var(--c); border-radius:12px; padding:12px 14px; background:var(--surface);}
.famcard b{display:block; color:var(--c); font-size:15px; margin-bottom:4px;}
.famcard .mono{font-size:13.5px;}
.famgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
@media (max-width:860px){ .famgrid{grid-template-columns:repeat(2,1fr);} }
.chip{display:inline-block; font-family:"IBM Plex Mono"; font-weight:600; font-size:13px; color:var(--c); border:1px solid var(--c); border-radius:7px; padding:2px 8px; background:color-mix(in srgb,var(--c) 10%,var(--surface));}

.anatomy{display:flex; gap:10px; align-items:stretch; justify-content:center; flex-wrap:wrap; font-family:"IBM Plex Mono";}
.anatomy div{border:1px dashed var(--line); border-radius:10px; padding:10px 16px; text-align:center; font-size:22px; font-weight:600; background:var(--surface);}
.anatomy div small{display:block; font-family:"IBM Plex Sans"; font-size:12px; font-weight:500; color:var(--ink-soft); margin-top:4px;}
.anatomy .op{border:2px solid var(--f-comp); color:var(--f-comp);}

/* esquema BD */
.schema{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px;}
.tcard{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface); box-shadow:var(--shadow);}
.tcard header{background:var(--accent); color:var(--accent-ink); font-family:"IBM Plex Mono"; font-weight:600; font-size:14px; padding:7px 12px;}
.tcard ul{list-style:none; margin:0; padding:8px 12px; font-family:"IBM Plex Mono"; font-size:13px; line-height:1.8;}
.tcard li span{font-size:10.5px; font-weight:600; border-radius:4px; padding:0 4px; margin-left:5px; border:1px solid var(--line); color:var(--ink-soft);}
.tcard li span.pk{color:var(--amber); border-color:var(--amber);}
.tcard li span.fk{color:var(--f-comp); border-color:var(--f-comp);}
.tcard footer{font-size:12px; color:var(--ink-soft); padding:0 12px 8px;}

/* pasos */
.steps{display:flex; gap:6px; flex-wrap:wrap;}
.stepbtn{font-family:"IBM Plex Sans"; font-weight:600; font-size:14px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft); border-radius:99px; padding:7px 14px; cursor:pointer;}
.stepbtn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.steppanel{display:none; flex-direction:column; gap:10px;}
.steppanel.active{display:flex;}

/* agenda */
.agenda{display:grid; grid-template-columns:auto 1fr auto; gap:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface);}
.agenda div{padding:9px 14px; border-bottom:1px solid var(--line); font-size:15px;}
.agenda div:nth-last-child(-n+3){border-bottom:none;}
.agenda .num{font-family:"IBM Plex Mono"; color:var(--accent); font-weight:600;}
.agenda .min{font-family:"IBM Plex Mono"; color:var(--ink-soft); text-align:right; white-space:nowrap;}

/* venn */
.venn-wrap{display:grid; grid-template-columns:minmax(260px,1fr) 1.2fr; gap:16px; align-items:start;}
@media (max-width:820px){ .venn-wrap{grid-template-columns:1fr;} }
svg.venn{width:100%; height:auto; max-width:440px;}
svg.venn .rg{fill:var(--f-conj); opacity:.08; transition:opacity .25s;}
svg.venn .rg.on{opacity:.45;}
svg.venn .outline{fill:none; stroke:var(--ink-soft); stroke-width:1.5;}
svg.venn text{fill:var(--ink); font-family:"IBM Plex Mono"; font-size:12.5px;}
svg.venn text.ttl{font-family:"IBM Plex Sans"; font-weight:600; font-size:13px; fill:var(--ink-soft);}
svg.venn text.twice{fill:var(--bad); font-weight:600; opacity:0; transition:opacity .25s;}
svg.venn text.twice.on{opacity:1;}
.setbtns{display:flex; gap:6px; flex-wrap:wrap;}
.setbtn{font-family:"IBM Plex Mono"; font-weight:600; font-size:13px; border:1px solid var(--f-conj); color:var(--f-conj); background:var(--surface); border-radius:8px; padding:7px 12px; cursor:pointer;}
.setbtn.active{background:var(--f-conj); color:var(--accent-ink);}

/* quiz */
.quiz{display:flex; flex-direction:column; gap:8px;}
.quiz .qtext{font-weight:600; font-size:16px;}
.choice{text-align:left; font-family:"IBM Plex Sans"; font-size:15px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; padding:10px 14px; cursor:pointer;}
.choice:hover{border-color:var(--accent);}
.choice code{background:none; border:none; padding:0;}
.choice.correct{border-color:var(--good); background:color-mix(in srgb,var(--good) 12%,var(--surface));}
.choice.wrong{border-color:var(--bad); background:color-mix(in srgb,var(--bad) 10%,var(--surface));}
.feedback{display:none; font-size:14.5px; line-height:1.55; padding:8px 12px; border-radius:8px;}
.feedback.show{display:block;}
.feedback.ok{color:var(--good); background:color-mix(in srgb,var(--good) 10%,var(--surface));}
.feedback.no{color:var(--bad); background:color-mix(in srgb,var(--bad) 8%,var(--surface));}

/* actividad 1: clasificar */
.pool{display:flex; flex-wrap:wrap; gap:8px; min-height:56px; padding:12px; border:1px dashed var(--line); border-radius:12px; background:var(--surface);}
.opcard{font-family:"IBM Plex Mono"; font-weight:600; font-size:15px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:9px; padding:7px 12px; cursor:grab; user-select:none;}
.opcard.sel{outline:2px solid var(--accent); outline-offset:2px; background:color-mix(in srgb,var(--accent) 14%,var(--surface));}
.opcard.ok{border-color:var(--good); background:color-mix(in srgb,var(--good) 16%,var(--surface));}
.opcard.bad{border-color:var(--bad); background:color-mix(in srgb,var(--bad) 14%,var(--surface)); text-decoration:line-through wavy var(--bad);}
.bins{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
@media (max-width:860px){ .bins{grid-template-columns:repeat(2,1fr);} }
.bin{border:1px solid var(--line); border-top:4px solid var(--c); border-radius:12px; background:var(--surface); min-height:120px; display:flex; flex-direction:column; cursor:pointer;}
.bin.over{background:color-mix(in srgb,var(--c) 10%,var(--surface));}
.bin h4{margin:0; padding:8px 10px 4px; font-size:13.5px; color:var(--c); font-family:"IBM Plex Sans";}
.bin .drop{display:flex; flex-wrap:wrap; gap:6px; padding:6px 8px 10px; flex:1;}
.bin .drop .opcard{font-size:13.5px; padding:5px 9px;}
.actbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.score{font-family:"IBM Plex Mono"; font-weight:600; font-size:14px;}

/* actividad 2: detectar */
.catbar{display:flex; gap:6px; flex-wrap:wrap; position:sticky; top:-2px; z-index:3; background:var(--bg); padding:8px 0;}
.catbtn{font-family:"IBM Plex Sans"; font-weight:600; font-size:13.5px; border:1px solid var(--c); color:var(--c); background:var(--surface); border-radius:8px; padding:7px 11px; cursor:pointer;}
.catbtn:hover{background:color-mix(in srgb,var(--c) 12%,var(--surface));}
.detq{display:flex; flex-direction:column; gap:6px;}
.detq .lbl{font-family:"IBM Plex Mono"; font-size:12px; color:var(--ink-soft);}
.optok{font-family:"IBM Plex Mono"; font-size:14.5px; font-weight:600; color:var(--code-fg); background:transparent; border:1.5px dashed #8a97a8; border-radius:6px; padding:0 5px; margin:0 1px; cursor:pointer; line-height:1.5; position:relative;}
.optok.sel{border-style:solid; border-color:#ffffff; background:rgba(255,255,255,.14);}
.optok[data-as]{border-style:solid;}
.optok[data-as="comp"]{border-color:#6aa6e8; background:rgba(106,166,232,.22);}
.optok[data-as="arit"]{border-color:#b28be6; background:rgba(178,139,230,.22);}
.optok[data-as="logi"]{border-color:#e7a94a; background:rgba(231,169,74,.22);}
.optok[data-as="espe"]{border-color:#e07bb0; background:rgba(224,123,176,.22);}
.optok[data-as="conj"]{border-color:#43c2c7; background:rgba(67,194,199,.22);}
.optok .tag{margin-left:5px; font-size:9.5px; font-family:"IBM Plex Sans"; font-weight:700; letter-spacing:.03em; color:var(--code-fg); opacity:.85; vertical-align:1px; pointer-events:none;}
.optok .tag:empty{display:none;}
.optok.ok::after, .optok.bad::after{position:absolute; right:-7px; top:-9px; font-size:11px; width:15px; height:15px; line-height:15px; text-align:center; border-radius:99px; color:#fff; font-family:"IBM Plex Sans";}
.optok.ok::after{content:"✓"; background:#1f7a4d;}
.optok.bad::after{content:"✗"; background:#b5342d;}
.detq pre.code{padding-top:16px; line-height:2.1; white-space:pre-wrap;}
.legend{display:flex; gap:10px; flex-wrap:wrap; font-size:13px;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend i{width:12px; height:12px; border-radius:3px; background:var(--c); display:inline-block;}

.center-note{text-align:center; color:var(--ink-soft); font-size:14px;}
.kbd{font-family:"IBM Plex Mono"; font-size:12px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; background:var(--surface-2);}
.toast{position:fixed; left:50%; bottom:74px; transform:translateX(-50%); background:var(--ink); color:var(--bg); font-size:14px; padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20;}
.toast.show{opacity:1;}

.code .f{color:#8fd694; font-weight:600;}
.famgrid4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
@media (max-width:860px){ .famgrid4{grid-template-columns:repeat(2,1fr);} }
@media (max-width:520px){ .famgrid4{grid-template-columns:1fr;} }
.famgrid4 .famcard p{font-size:13.5px; margin-top:6px; line-height:1.5;}
/* laboratorio substring */
.lab{display:flex; flex-direction:column; gap:12px;}
.labctl{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;}
.labctl label{display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:600; color:var(--ink-soft);}
.labctl select, .labctl input, .pin{font-family:"IBM Plex Mono"; font-size:15px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink);}
.labctl input{width:110px;}
.charrow{display:flex; flex-wrap:wrap; gap:4px;}
.cbox{display:flex; flex-direction:column; align-items:center; min-width:30px; border:1px solid var(--line); border-radius:7px; padding:4px 3px; background:var(--surface-2);}
.cbox b{font-family:"IBM Plex Mono"; font-size:17px;}
.cbox span{font-family:"IBM Plex Mono"; font-size:10.5px; color:var(--ink-soft);}
.cbox span.neg{color:var(--amber);}
.cbox.on{background:color-mix(in srgb,var(--accent) 22%,var(--surface)); border-color:var(--accent);}
.subres{font-size:16px; font-weight:600;}
.subres .mono{color:var(--accent); font-size:17px;}
/* recta numérica */
svg.numline{width:100%; max-width:560px; height:auto;}
svg.numline .ax{stroke:var(--ink-soft); stroke-width:2;}
svg.numline .tk{stroke:var(--ink-soft); stroke-width:2;}
svg.numline .tl{fill:var(--ink); font-family:"IBM Plex Mono"; font-size:13px;}
svg.numline .pt{fill:var(--amber);}
svg.numline .px{fill:var(--amber); font-family:"IBM Plex Mono"; font-size:13px; font-weight:600;}
/* retos */
.reto{display:flex; flex-direction:column; gap:10px;}
.reto .enun{font-size:16px; line-height:1.6;}
/* predice */
.predgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
@media (max-width:760px){ .predgrid{grid-template-columns:1fr;} }
.predrow{display:grid; grid-template-columns:1fr 140px; gap:4px 8px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--surface);}
.predrow .pexp{font-size:13.5px; background:none; border:none; padding:0; overflow-wrap:anywhere;}
.predrow .pin{width:100%; font-size:14px; padding:5px 8px;}
.predrow .pmark{grid-column:1 / -1; font-size:12.5px; font-family:"IBM Plex Mono"; color:var(--ink-soft); min-height:0;}
.predrow.ok{border-color:var(--good); background:color-mix(in srgb,var(--good) 10%,var(--surface));}
.predrow.ok .pmark{color:var(--good);}
.predrow.bad{border-color:var(--bad); background:color-mix(in srgb,var(--bad) 8%,var(--surface));}
.predrow.bad .pmark{color:var(--bad);}
/* autoevaluación */
.autolist{display:flex; flex-direction:column; gap:10px;}
.aq{border:1px solid var(--line); border-radius:12px; padding:10px 14px 12px; background:var(--surface); margin:0;}
.aq legend{font-weight:600; font-size:15.5px; padding:0 6px; line-height:1.5;}
.aq .anum{display:inline-block; min-width:24px; text-align:center; font-family:"IBM Plex Mono"; color:var(--accent-ink); background:var(--accent); border-radius:6px; margin-right:4px;}
.aopt{display:flex; gap:8px; align-items:flex-start; padding:5px 6px; border-radius:8px; cursor:pointer; font-size:15px;}
.aopt:hover{background:var(--surface-2);}
.aq.ok{border-color:var(--good);} .aq.bad{border-color:var(--bad);}
.aq.ok .aopt.right, .aq.bad .aopt.right{background:color-mix(in srgb,var(--good) 14%,var(--surface));}
.aexp{font-size:14px; line-height:1.55; color:var(--ink-soft); margin-top:4px;}
.aexp:empty{display:none;}

pps sin calificación (calificacion queda NULL porque se omite la columna)\nINSERT INTO aplicaciones (id, nombre, categoria, precio, descargas, desarrollador_id) VALUES\n  ( 8, 'BiciRuta',      'Navegacion',    0,    950, 5),\n  (12, 'AulaViva',      'Educacion',     0,    400, 2);\n\n-- ---------------------------------------------------------------------\n-- 3. usuarios: personas registradas en la tienda\n--    email NULL = el usuario no registró correo\n-- ---------------------------------------------------------------------\nCREATE TABLE usuarios (\n  id      INT          PRIMARY KEY,\n  nombre  VARCHAR(50)  NOT NULL,\n  ciudad  VARCHAR(30)  NOT NULL,\n  email   VARCHAR(60)\n);\n\nINSERT INTO usuarios (id, nombre, ciudad, email) VALUES\n  (1, 'Laura Gómez',    'Bogotá',       'laura.gomez@mail.com'),\n  (2, 'Santiago Ruiz',  'Medellín',     'santi.ruiz@mail.com'),\n  (3, 'Valentina Díaz', 'Pereira',      'vale.diaz@mail.com'),\n  (4, 'Mateo Herrera',  'Cali',         'mateo.h@mail.com'),\n  (5, 'Camila Torres',  'Bogotá',       'cami.torres@mail.com'),\n  (7, 'Sofía Castro',   'Pereira',      'sofia.castro@mail.com'),\n  (8, 'Juan Morales',   'Bogotá',       'juan.morales@mail.com');\n\n-- Usuario sin email (email queda NULL porque se omite la columna)\nINSERT INTO usuarios (id, nombre, ciudad) VALUES\n  (6, 'Andrés Pérez',   'Barranquilla');\n\n-- ---------------------------------------------------------------------\n-- 4. descargas: qué usuario descargó qué aplicación\n-- ---------------------------------------------------------------------\nCREATE TABLE descargas (\n  usuario_id INT NOT NULL,\n  app_id     INT NOT NULL,\n  PRIMARY KEY (usuario_id, app_id),\n  FOREIGN KEY (usuario_id) REFERENCES usuarios(id),\n  FOREIGN KEY (app_id)     REFERENCES aplicaciones(id)\n);\n\nINSERT INTO descargas (usuario_id, app_id) VALUES\n  (1, 1), (1, 3), (1, 6),\n  (2, 3), (2, 5), (2, 9),\n  (3, 2), (3, 4), (3, 10),\n  (4, 1), (4, 5),\n  (5, 3), (5, 11),\n  (7, 2), (7, 7);\n\n const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const KW = /^(SELECT|FROM|WHERE|AS|ORDER|BY|GROUP|HAVING|UNION|ALL|AND|OR|NOT|BETWEEN|IN|LIKE|IS|NULL|DESC|ASC|DISTINCT|LIMIT|DIV)$/i;
const FN = /^(COUNT|SUM|AVG|MAX|MIN|UPPER|LOWER|CONCAT|CONCAT_WS|SUBSTRING|SUBSTR|CHAR_LENGTH|LENGTH|REPLACE|TRIM|CEILING|CEIL|FLOOR|ROUND|TRUNCATE|ABS|MOD|RIGHT)$/i;
function hl(sql){
  const re = /(--[^\n]*)|('(?:[^']|'')*')|([A-Za-z_][A-Za-z_0-9]*)|(\d+(?:\.\d+)?)|([\s\S])/g;
  let out = '', m;
  while((m = re.exec(sql))){
    if(m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if(m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if(m[3]) out += KW.test(m[3]) ? `<span class="k">${esc(m[3])}</span>` : (FN.test(m[3]) ? `<span class="f">${esc(m[3])}</span>` : esc(m[3]));
    else if(m[4]) out += `<span class="n">${esc(m[4])}</span>`;
    else out += esc(m[5]);
  }
  return out;
}
function table(id, caption){
  const r = R[id];
  if(!r) return `<div class="err">Resultado no disponible (${esc(id)})</div>`;
  if(r.error) return `<div class="err">Error (MySQL): ${esc(r.error.replace(/^ERROR \d+: /, ''))}</div>`;
  const n = r.rows.length;
  const cap = caption !== undefined ? caption : `${n} ${n===1?'fila':'filas'}`;
  if(n===0) return `<div class="table-wrap"><table class="data"><caption>${cap}</caption><thead><tr>${r.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody><tr><td colspan="${r.cols.length}" class="null">(sin filas)</td></tr></tbody></table></div>`;
  return `<div class="table-wrap"><table class="data"><caption>${cap}</caption><thead><tr>${r.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
    r.rows.map(row=>`<tr>${row.map(v=>v==='NULL'?`<td class="null">NULL</td>`:`<td>${esc(v)}</td>`).join('')}</tr>`).join('')
  }</tbody></table></div>`;
}
let uid = 0;
function ex(id, label, opts){
  opts = opts || {};
  const rid = 'rv' + (uid++);
  const isErr = R[id] && R[id].error;
  const btnTxt = isErr ? 'Ver qué pasa' : 'Ver resultado';
  return `<div class="ex">
    <div class="ex-head">${label ? `<span class="pill">${label}</span>` : '<span></span>'}
      <div class="ex-actions">
        <button class="mini" type="button" data-copy="${id}">Copiar</button>
        <button class="reveal-btn" type="button" data-reveal="${rid}" data-show="${btnTxt}" data-hide="Ocultar">${opts.open?'Ocultar':btnTxt}</button>
      </div>
    </div>
    <pre class="code">${hl(Q[id])}</pre>
    <div class="reveal-box${opts.open?' show':''}" id="${rid}">${table(id)}${opts.after||''}</div>
  </div>`;
}
let tg = 0;
function tabs(items){
  const g = 'tg' + (tg++);
  return `<div class="tabset"><div class="tabs" role="tablist">${
    items.map((it,i)=>`<button class="tab${i===0?' active':''}" type="button" role="tab" data-tabgroup="${g}" data-tabidx="${i}">${it[0]}</button>`).join('')
  }</div>${
    items.map((it,i)=>`<div class="tabpanel${i===0?' active':''}" data-tabgroup="${g}" data-tabidx="${i}">${it[1]}</div>`).join('')
  }</div>`;
}
let sg = 0;
function steps(items){
  const g = 'sg' + (sg++);
  return `<div class="steps">${
    items.map((it,i)=>`<button class="stepbtn${i===0?' active':''}" type="button" data-stepgroup="${g}" data-stepidx="${i}">${it[0]}</button>`).join('')
  }</div>${
    items.map((it,i)=>`<div class="steppanel${i===0?' active':''}" data-stepgroup="${g}" data-stepidx="${i}">${it[1]}</div>`).join('')
  }`;
}
function quiz(question, options, correct, okMsg, noMsg){
  return `<div class="quiz card" data-quizroot data-correct="${correct}">
    <div class="qtext">${question}</div>
    ${options.map((o,i)=>`<button class="choice" type="button" data-idx="${i}">${o}</button>`).join('')}
    <div class="feedback" data-ok="${esc(okMsg)}" data-no="${esc(noMsg)}"></div>
  </div>`;
}
function reto(id, enunciado){
  const rid = 'rv' + (uid++);
  return `<div class="reto"><p class="enun">${enunciado}</p>
    <div class="actbar"><button class="reveal-btn" type="button" data-reveal="${rid}" data-show="Ver solución" data-hide="Ocultar solución">Ver solución</button></div>

      <div class="ex-head"><span class="pill">Solución posible</span><div class="ex-actions"><button class="mini" type="button" data-copy="${id}">Copiar</button></div></div>
      <pre class="code">${hl(Q[id])}</pre>${table(id)}</div></div>`;
}

`});

// 3. Nuevo motor
S({section:true, eyebrow:'01 · Nueva plataforma', title:'Esta semana trabajamos en RunSQL con MySQL',
body:`
<p class="lede">En SQLite, funciones como <code>CEILING</code>, <code>FLOOR</code> o <code>TRUNC</code> solo existen si el motor se compiló con las funciones matemáticas, y <code>CONCAT</code> solo en versiones recientes. <b>MySQL</b> las incluye de forma nativa. Lo usaremos en <b>RunSQL</b> (runsql.com), que ofrece MySQL 8.4 y no limita la cantidad de consultas.</p>
<div class="grid2">
  <div class="card">
    <h3>Cargar la base de datos</h3>
    <ol style="margin:0;padding-left:20px;line-height:1.7;font-size:15px;">
      <li>Entra a <b>runsql.com</b> y pulsa <b>Run your SQL</b>.</li>
      <li>Arriba, en el selector de motor, elige <b>MySQL 8.4</b>.</li>
      <li>Pulsa <b>Import</b> → <b>From MySQL 8.4</b>.</li>
      <li>Abre <code>tiendaapp_semana3_mysql.sql</code>, copia todo y pégalo en el recuadro (o usa el botón de abajo).</li>
      <li>Marca <b>Clear DBML and table records</b> y pulsa <b>Apply</b>.</li>
      <li>En el panel 3 (<b>Write SQL Query</b>) ejecuta la consulta de verificación con <b>Run</b>.</li>
    </ol>
    <div class="actbar" style="margin-top:10px;"><button class="mini" type="button" data-copy="__SCRIPT__">Copiar script completo</button></div>
  </div>
  <div class="card">
    <h3>Verificación</h3>
    ${ex('VERIF','Consulta de verificación')}
  </div>
</div>
`});

// 3b. Cómo funciona RunSQL
S({eyebrow:'01 · Nueva plataforma', title:'Cómo funciona RunSQL',
body:`
<p class="lede">RunSQL no ejecuta el script de creación en el editor de consultas. La base de datos se arma a partir de su <b>estructura</b>: al importar el script, RunSQL lo convierte en los paneles 1 y 2.</p>
<div class="grid3">
  <div class="card"><h3>1 · Define Database Structure</h3><p>Las tablas y columnas, escritas en <b>DBML</b> (un lenguaje sencillo para describir tablas). Se genera solo al importar el script.</p></div>
  <div class="card"><h3>2 · Define Data</h3><p>Las filas de cada tabla, en una cuadrícula tipo hoja de cálculo. Una pestaña por tabla.</p></div>
  <div class="card"><h3>3 · Write SQL Query</h3><p>Aquí escribes tus consultas y pulsas <b>Run</b>. El resultado aparece en <b>Query Result</b>.</p></div>
</div>
<div class="grid2">
  <div class="callout tip"><strong>Una consulta a la vez:</strong> si el editor tiene varias consultas, <b>selecciona</b> la que quieres y el botón cambia a <b>Run Selected</b>. Con varias consultas sin seleccionar, MySQL responde con error de sintaxis.</div>
  <div class="callout warn"><strong>No escribas la palabra null en la cuadrícula:</strong> se guarda como texto y la carga falla. Para dejar una celda en NULL usa el botón <b>Set null</b>. Si algo se daña, vuelve a importar el script.</div>
</div>
`});

// 5. Diferencias
S({eyebrow:'01 · Nuevo motor', title:'Tres diferencias que debes conocer',
body:`
<p class="lede">La mayoría de lo que aprendiste funciona igual. Estas tres diferencias sí cambian resultados:</p>
${tabs([
  ['1. La división', `${ex('D1','')}<div class="callout tip">En SQLite <code>7 / 2</code> daba <b>3</b>. En MySQL <code>/</code> siempre da el resultado con decimales (<b>3.5000</b>). Para la división entera se usa <code>DIV</code>.</div>`],
  ['2. Mayúsculas en comparaciones', `${ex('D2','')}<div class="callout tip">En la semana 2 esta consulta devolvía 0 filas. Con la configuración de MySQL en RunSQL las comparaciones de texto <b>no distinguen mayúsculas</b>: <code>'juegos'</code> encuentra <code>'Juegos'</code>.</div>`],
  ['3. El operador ||', `${ex('D3','')}<div class="callout warn">En MySQL <code>||</code> <b>no une textos</b>: es el operador lógico OR. Por eso devuelve 0 en lugar de un texto. Para unir textos usa siempre <code>CONCAT()</code>.</div>`]
])}
`});

// 6. Qué es una función
S({section:true, eyebrow:'02 · Funciones de cadena', title:'¿Qué es una función en SQL?',
body:`
<p class="lede">Una función recibe uno o más <b>argumentos</b> entre paréntesis y <b>devuelve un valor</b>. No modifica la tabla: solo cambia lo que ves en el resultado.</p>
<div class="anatomy">
  <div class="op">UPPER<small>nombre de la función</small></div>
  <div>(<small>abre</small></div>
  <div>nombre<small>argumento: columna, texto o número</small></div>
  <div>)<small>cierra</small></div>
  <div>→ 'PIXELRUN'<small>valor devuelto</small></div>
</div>
<div class="grid2">
  <div class="card"><h3>Funciones de fila (esta semana)</h3><p style="margin-bottom:8px;">Se aplican a <b>cada fila</b>: entran 4 filas, salen 4 filas.</p>${ex('F0','',{open:true})}</div>
  <div class="card"><h3>Funciones de agregación (semana 1)</h3><p style="margin-bottom:8px;">Resumen <b>muchas filas en una</b>: entran 12 filas, sale 1.</p>${ex('F0b','',{open:true})}</div>
</div>
<div class="callout note"><strong>Dónde se pueden usar:</strong> en el <code>SELECT</code> (para mostrar), en el <code>WHERE</code> (para filtrar) y en el <code>ORDER BY</code> (para ordenar). Ponle siempre un <b>alias</b> con <code>AS</code> a la columna calculada.</div>
`});

// 13. Funciones matemáticas: resumen
S({section:true, eyebrow:'03 · Funciones matemáticas', title:'Cuatro formas de quitar decimales',
body:`
<p class="lede">Todas reciben un número y devuelven otro número. La diferencia está en <b>hacia dónde</b> mueven el valor.</p>
<div class="famgrid4">
  <div class="famcard fam comp"><b>CEILING(x)</b><span class="mono">techo · hacia arriba</span><p>El entero más pequeño que es mayor o igual a x. <code>CEILING(4.1)</code> = 5. Alias: <code>CEIL</code>.</p></div>
  <div class="famcard fam arit"><b>FLOOR(x)</b><span class="mono">piso · hacia abajo</span><p>El entero más grande que es menor o igual a x. <code>FLOOR(4.9)</code> = 4.</p></div>
  <div class="famcard fam logi"><b>ROUND(x, d)</b><span class="mono">al más cercano</span><p>Redondea a <i>d</i> decimales; desde 5 sube. <code>ROUND(4.65, 1)</code> = 4.7. Sin <i>d</i> redondea a entero.</p></div>
  <div class="famcard fam espe"><b>TRUNCATE(x, d)</b><span class="mono">cortar</span><p>Deja <i>d</i> decimales y <b>descarta</b> el resto sin redondear. <code>TRUNCATE(4.65, 1)</code> = 4.6. La <i>d</i> es obligatoria.</p></div>
</div>
<div class="callout note"><strong>Nombres en otros motores:</strong> la planeación menciona TRUNC; en MySQL (y MariaDB) la función se llama <code>TRUNCATE(x, d)</code>. PostgreSQL y Oracle usan <code>TRUNC</code>.</div>
`});

// 15. CEILING / FLOOR
S({eyebrow:'03 · Funciones matemáticas', title:'CEILING y FLOOR en casos reales',
body:`
${tabs([
  ['Estrellas', ex('M1','Nivel 1 · techo y piso de la calificación')],
  ['Servidores', ex('M2','Nivel 2 · ¿cuántos servidores de 10 000 descargas?') + `<div class="callout tip">CEILING es la función correcta cuando <b>no puedes quedarte corto</b>: 42 000 descargas necesitan 5 servidores, no 4.2 ni 4.</div>`]

  <div class="callout note"><strong>Usa CEILING</strong> cuando necesitas completar: cajas, servidores, buses, páginas de resultados.</div>

</div>
`});

// 16. ROUND
S({eyebrow:'03 · Funciones matemáticas', title:'ROUND: redondear al valor más cercano',
body:`
<pre class="code">${hl("ROUND(x)       -- a entero\nROUND(x, 2)    -- a 2 decimales\nROUND(x, -3)   -- a miles (decimales negativos redondean a la izquierda del punto)")}</pre>
${tabs([
  ['Precio con IVA', ex('M3','Nivel 1 · 19 % de IVA con 2 decimales') + `<div class="callout tip">Sin ROUND, <code>precio * 1.19</code> muestra 4 decimales. En dinero se muestran 2.</div>`],
  ['Decimales negativos', ex('M4','Nivel 2 · aproximar descargas a miles')]
])}
<div class="callout note"><strong>La regla del 5:</strong> si el dígito que se elimina es 5 o más, sube; si es menor, se queda. <code>ROUND(4.45, 1)</code> = 4.5 y <code>ROUND(4.44, 1)</code> = 4.4.</div>
`});

// 17. TRUNCATE vs ROUND
S({eyebrow:'03 · Funciones matemáticas', title:'TRUNCATE frente a ROUND',
body:`
<p class="lede"><code>TRUNCATE(x, d)</code> no mira el dígito siguiente: simplemente <b>corta</b>. Compara las columnas:</p>
${ex('M5','Mismo precio, tres tratamientos', {open:true})}
<div class="table-wrap"><table class="data ops"><caption>Resumen con x = 2.99</caption>
<thead><tr><th>Expresión</th><th>Resultado</th><th>¿Por qué?</th></tr></thead><tbody>
<tr><td>ROUND(2.99, 1)</td><td>3.0</td><td>el 9 eliminado es ≥ 5, sube</td></tr>
<tr><td>TRUNCATE(2.99, 1)</td><td>2.9</td><td>corta después del primer decimal</td></tr>
<tr><td>TRUNCATE(2.99, 0)</td><td>2</td><td>solo la parte entera</td></tr>
<tr><td>CEILING(2.99)</td><td>3</td><td>siguiente entero hacia arriba</td></tr>
<tr><td>FLOOR(2.99)</td><td>2</td><td>entero hacia abajo</td></tr>
</tbody></table></div>
`});

// 18. Complementarias matemáticas
S({eyebrow:'03 · Funciones matemáticas', title:'Funciones matemáticas complementarias',
body:`
${ex('M6','ABS, MOD y DIV', {open:true})}
<div class="grid3">
  <div class="card"><h3><code>ABS(x)</code></h3><p>Valor absoluto: quita el signo negativo. Útil para diferencias.</p></div>
  <div class="card"><h3><code>MOD(a, b)</code></h3><p>Residuo de la división. Igual que <code>a % b</code>. 17 = 5·3 + <b>2</b>.</p></div>

</div>
`});

body:`
${tabs([

const viewport = document.getElementById('viewport');
const dotsEl = document.getElementById('dots');
let current = 0;
slides.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.section ? ' section-slide' : '') + (s.cls ? ' '+s.cls : '');
  el.id = 'slide-' + i;
  el.setAttribute('aria-label', 'Diapositiva ' + (i+1) + ': ' + s.title);
  el.innerHTML = `<div class="slide-inner">${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<h2>${s.title}</h2>${s.body}</div>`;
  viewport.appendChild(el);
  const d = document.createElement('button');
  d.type = 'button';
  d.className = 'dot' + (s.section ? ' section' : '');
  d.setAttribute('aria-label', 'Ir a la diapositiva ' + (i+1));
  d.addEventListener('click', ()=>goTo(i));
  dotsEl.appendChild(d);
});
const total = slides.length;
const pad = n => String(n).padStart(2,'0');
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active', i===current));
  dotsEl.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active', i===current));
  document.getElementById('counter').textContent = pad(current+1) + '/' + pad(total);
  document.getElementById('progress-fill').style.width = (current/(total-1)*100) + '%';
  document.getElementById('btn-prev').disabled = current===0;
  document.getElementById('btn-next').disabled = current===total-1;
  try{ history.replaceState(null,'','#'+(current+1)); }catch(e){}
}
function goTo(i){
  const n = Math.max(0, Math.min(total-1, i));
  if(n===current && document.querySelector('.slide.active')) return;
  current = n; render();
  const el = document.getElementById('slide-'+current); if(el) el.scrollTop = 0;
}
document.getElementById('btn-prev').addEventListener('click', ()=>goTo(current-1));
document.getElementById('btn-next').addEventListener('click', ()=>goTo(current+1));
document.addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input,textarea,select')) return;
  if(e.key==='ArrowRight' || e.key==='PageDown'){ e.preventDefault(); goTo(current+1); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); goTo(current-1); }
  else if(e.key==='Home'){ goTo(0); } else if(e.key==='End'){ goTo(total-1); }
});
let touchX=null, touchY=null;
viewport.addEventListener('touchstart', e=>{ touchX=e.touches[0].clientX; touchY=e.touches[0].clientY; }, {passive:true});
viewport.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
  const inScrollable = e.target.closest && e.target.closest('pre,.table-wrap,.pool,.bins');
  if(!inScrollable && Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ dx<0 ? goTo(current+1) : goTo(current-1); }
  touchX=null;
}, {passive:true});

// LABORATORIO SUBSTRING (misma lógica que MySQL, comprobada)
// =========================================================
function mariaSubstring(txt, start, len){
  const ch = Array.from(txt), n = ch.length;
  let i;
  if(start > 0) i = start - 1;
  else if(start < 0){ if(-start > n) return ''; i = n + start; }
  else return '';
  if(i >= n) return '';
  if(len === null) return ch.slice(i).join('');
  if(len <= 0) return '';
  return ch.slice(i, i + len).join('');
}
function subUpdate(){
  const txt = document.getElementById('sub-text').value;
  const sv = document.getElementById('sub-start').value.trim();
  const lv = document.getElementById('sub-len').value.trim();
  const start = sv === '' ? 1 : parseInt(sv, 10);
  const len = lv === '' ? null : parseInt(lv, 10);
  const ch = Array.from(txt), n = ch.length;
  const out = mariaSubstring(txt, start, len);
  let from = -1, to = -1;
  if(out !== ''){
    from = start > 0 ? start - 1 : n + start;
    to = from + Array.from(out).length - 1;
  }
  document.getElementById('sub-boxes').innerHTML = ch.map((c,k)=>`<div class="cbox${k>=from && k<=to ? ' on':''}"><b>${esc(c===' '?'␣':c)}</b><span>${k+1}</span><span class="neg">${k-n}</span></div>`).join('');
  const sql = `SELECT SUBSTRING('${txt}', ${start}${len===null?'':', '+len}) AS resultado;`;
  document.getElementById('sub-sql').innerHTML = hl(sql);
  document.getElementById('sub-out').textContent = out === '' ? "'' (texto vacío)" : `'${out}'`;
}

}

// EVENTOS (delegación)
// =========================================================
document.addEventListener('click', e=>{
  const t = e.target;
  const cp = t.closest('[data-copy]');
  if(cp){ const k = cp.dataset.copy; copyText(k==='__SCRIPT__' ? SQL_SCRIPT : Q[k]); return; }
  const rv = t.closest('[data-reveal]');
  if(rv){ const box = document.getElementById(rv.dataset.reveal); const on = box.classList.toggle('show'); rv.textContent = on ? rv.dataset.hide : rv.dataset.show; return; }
  const tab = t.closest('.tab');
  if(tab){ const g=tab.dataset.tabgroup, i=tab.dataset.tabidx;
    document.querySelectorAll(`.tab[data-tabgroup="${g}"]`).forEach(b=>b.classList.toggle('active', b===tab));
    document.querySelectorAll(`.tabpanel[data-tabgroup="${g}"]`).forEach(p=>p.classList.toggle('active', p.dataset.tabidx===i)); return; }
  const sb = t.closest('.stepbtn');
  if(sb){ const g=sb.dataset.stepgroup, i=sb.dataset.stepidx;
    document.querySelectorAll(`.stepbtn[data-stepgroup="${g}"]`).forEach(b=>b.classList.toggle('active', b===sb));
    document.querySelectorAll(`.steppanel[data-stepgroup="${g}"]`).forEach(p=>p.classList.toggle('active', p.dataset.stepidx===i)); return; }
  const lb = t.closest('#lab-btns .setbtn');
  if(lb){ labSelect(+lb.dataset.i); return; }
  if(t.id==='lab-show'){ labShow(); return; }
  if(t.id==='pred-check'){ predCheck(); return; }
  if(t.id==='pred-reset'){ predInit(); return; }
  if(t.id==='pred-solve'){ predSolve(); return; }
  if(t.id==='auto-check'){ autoCheck(); return; }
  if(t.id==='auto-reset'){ autoInit(); document.getElementById('auto').scrollIntoView({block:'start'}); return; }
});
['sub-text','sub-start','sub-len'].forEach(id=>{ const el=document.getElementById(id); el.addEventListener('input', subUpdate); el.addEventListener('change', subUpdate); });
document.getElementById('lab-btns').innerHTML = LABS.map((k,i)=>`<button class="setbtn" type="button" data-i="${i}">${esc(R[k].rows[0][0])}</button>`).join('');

subUpdate();
labSelect(0);
predInit();
autoInit();
const h = parseInt((location.hash||'').slice(1),10);
current = (h>=1 && h<=total) ? h-1 : 0;
render();
})();
</script>
